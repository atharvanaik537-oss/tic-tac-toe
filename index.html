<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1><i class="fas fa-gamepad"></i> Tic Tac Toe Pro</h1>
            <p>Outsmart your opponent and get three in a row!</p>
        </div>
        
        <div class="game-body">
            <div class="game-info">
                <div class="player-turn active">
                    <h2>Current Turn</h2>
                    <div id="status">Player <span class="player-x">X</span>'s Turn</div>
                </div>
                
                <div class="score-board">
                    <div class="score score-x">
                        <h3><i class="fas fa-times"></i> Player X</h3>
                        <div class="score-value" id="scoreX">0</div>
                    </div>
                    <div class="score score-o">
                        <h3><i class="far fa-circle"></i> Player O</h3>
                        <div class="score-value" id="scoreO">0</div>
                    </div>
                </div>
                
                <div class="game-history">
                    <h3><i class="fas fa-history"></i> Game History</h3>
                    <ul class="history-list" id="historyList">
                        <li>Game started. X goes first.</li>
                    </ul>
                </div>
            </div>
            
            <div class="game-board">
                <div class="game-mode">
                    <div class="mode-btn active" id="modePvP">Player vs Player</div>
                    <div class="mode-btn" id="modePvC">Player vs Computer</div>
                </div>
                
                <div class="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>
                </div>
                
                <div class="controls">
                    <button id="resetBtn">
                        <i class="fas fa-redo"></i> Reset Round
                    </button>
                    <button id="newGameBtn">
                        <i class="fas fa-plus-circle"></i> New Game
                    </button>
                    <button id="themeBtn">
                        <i class="fas fa-palette"></i> Change Theme
                    </button>
                    <button id="soundBtn">
                        <i class="fas fa-volume-up"></i> Sound On
                    </button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Made with <i class="fas fa-heart" style="color:#ff0066;"></i> | Tic Tac Toe Pro v2.0</p>
        </div>
    </div>

    <audio id="clickSound" src="sounds/click.mp3" preload="auto"></audio>
    <audio id="winSound" src="sounds/win.mp3" preload="auto"></audio>
    <audio id="drawSound" src="sounds/draw.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
